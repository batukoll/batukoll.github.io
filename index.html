<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Batuhan KOL - Kişisel Portfolyo. Flutter, Mobil ve Web Yazılım Geliştiricisi, Bilgisayar Mühendisi.">
  <meta name="keywords" content="Batuhan KOL, Flutter, Dart, Yazılım Geliştirici, Bilgisayar Mühendisi, Portfolio, Bursa Uludağ Üniversitesi">
  <meta name="author" content="Batuhan KOL">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://batukoll.github.io/">
  <meta property="og:title" content="Batuhan KOL | Yazılım Geliştiricisi & Bilgisayar Mühendisi">
  <meta property="og:description" content="Batuhan KOL - Kişisel Portfolyo. Flutter, Mobil & Web Uygulama Geliştiricisi.">
  <meta property="og:image" content="assets/assets/foto.jpeg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://batukoll.github.io/">
  <meta property="twitter:title" content="Batuhan KOL | Yazılım Geliştiricisi & Bilgisayar Mühendisi">
  <meta property="twitter:description" content="Batuhan KOL - Kişisel Portfolyo. Flutter, Mobil & Web Uygulama Geliştiricisi.">
  <meta property="twitter:image" content="assets/assets/foto.jpeg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Batuhan KOL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Batuhan KOL | Yazılım Geliştiricisi & Bilgisayar Mühendisi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #090D16;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00D2FF;
      background: #090D16;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 210, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00D2FF;
      animation: spin 0.9s ease-in-out infinite;
    }
    .loading-text {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #9CA3AF;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">YÜKLENİYOR...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
